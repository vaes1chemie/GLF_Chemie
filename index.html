<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemie Grundlagenfach</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#faf9f7; font-family:'DM Sans',sans-serif; color:#1a1a1a; padding:24px; box-sizing:border-box; }
.box { max-width:440px; text-align:center; background:white; border:1px solid #e5e2dd; border-radius:14px; padding:32px 28px; }
h1 { font-family:'DM Serif Display',Georgia,serif; font-weight:400; font-size:1.8rem; margin:0 0 10px; }
p { color:#6b6560; line-height:1.6; margin:0; }
</style>
</head>
<body>
<div class="box">
  <img src="GKG_Chemie%20LOGO.png" alt="Logo GKG Chemie" style="height:80px;width:auto;margin-bottom:14px">
  <h1>Chemie Grundlagenfach</h1>
  <p>Bitte öffnen Sie die Seite über den Link Ihrer Klasse, den Sie von Ihrer Lehrperson erhalten haben.</p>
</div>
<script>
// Wer seine Klasse schon einmal geöffnet hat, wird direkt weitergeleitet.
try { const k = localStorage.getItem('glf-klasse'); if (k) location.replace(k + '/'); } catch (e) {}
</script>
</body>
</html>
