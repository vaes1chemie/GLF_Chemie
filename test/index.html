<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemie Grundlagenfach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#faf9f7; --bg-alt:#f3f1ee; --text:#1a1a1a; --muted:#6b6560; --light:#9c9891; --border:#e5e2dd; --accent:#4a7ab5;
  --serif:'DM Serif Display',Georgia,serif; --sans:'DM Sans',-apple-system,sans-serif; --mono:'JetBrains Mono',monospace; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--sans); background:var(--bg); color:var(--text); min-height:100vh; }
.header { background:#1e293b; color:white; padding:60px 24px 52px; text-align:center; position:relative; overflow:hidden; }
.header::before { content:''; position:absolute; inset:0; background: radial-gradient(circle at 25% 40%, rgba(74,122,181,0.15) 0%, transparent 50%), radial-gradient(circle at 75% 60%, rgba(123,192,138,0.1) 0%, transparent 40%); }
.header-content { position:relative; max-width:640px; margin:0 auto; }
.logo { display:inline-block; background:white; border-radius:14px; padding:8px 12px; margin-bottom:18px; box-shadow:0 4px 14px rgba(0,0,0,0.25); }
.logo img { display:block; height:72px; width:auto; }
.header-badge { display:inline-block; font-family:var(--mono); font-size:0.72rem; font-weight:600; letter-spacing:0.06em; background:rgba(74,122,181,0.2); border:1px solid rgba(74,122,181,0.3); color:#a8c4e0; padding:5px 16px; border-radius:100px; margin-bottom:16px; }
.header h1 { font-family:var(--serif); font-size:clamp(2.2rem,5vw,3.2rem); font-weight:400; line-height:1.15; margin-bottom:10px; }
.header p { font-size:1.05rem; color:#94a3b8; }
.main { max-width:820px; margin:0 auto; padding:48px 24px 80px; }
.section-label { font-family:var(--mono); font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--light); margin-bottom:16px; }
.topics { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.card { background:white; border:1px solid var(--border); border-radius:14px; padding:26px 22px 18px; display:flex; flex-direction:column; }
.card.locked { opacity:0.6; }
.num { font-family:var(--mono); font-size:0.68rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px; }
.title { font-family:var(--serif); font-size:1.35rem; line-height:1.25; margin-bottom:8px; }
.desc { font-size:0.85rem; color:var(--muted); line-height:1.5; margin-bottom:14px; }
.phases { border-top:1px solid var(--border); padding-top:10px; display:flex; flex-direction:column; gap:4px; margin-top:auto; }
.ph { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px; text-decoration:none; color:var(--text); font-size:0.85rem; }
a.ph:hover { background:var(--bg-alt); }
.ph .nr { font-family:var(--mono); font-size:0.68rem; font-weight:600; color:var(--light); min-width:54px; }
.ph .t { flex:1; }
.ph .st { font-size:0.7rem; font-weight:600; padding:2px 9px; border-radius:100px; white-space:nowrap; }
.st.frei { background:#eef6f0; color:#2d5a37; }
.st.bald { background:#fdf5ee; color:#8a5a2b; }
.st.zu { background:var(--bg-alt); color:var(--light); }
.dls { display:flex; flex-wrap:wrap; gap:6px; padding:0 10px 8px 72px; }
.dl { font-size:0.66rem; font-weight:600; padding:1px 8px; border-radius:100px; }
.dl.frei { background:#eef6f0; color:#2d5a37; } .dl.bald { background:#fdf5ee; color:#8a5a2b; } .dl.zu { background:var(--bg-alt); color:var(--light); }
.ph.zu { color:var(--light); }
.note { text-align:center; margin-top:48px; padding-top:24px; border-top:1px solid var(--border); font-size:0.82rem; color:var(--light); line-height:1.6; }
.err { background:#fceaea; border:1px solid #e07070; color:#7a2020; border-radius:10px; padding:16px 18px; }
@media (max-width:640px) { .topics { grid-template-columns:1fr; } .header { padding:44px 20px 40px; } }
</style>
</head>
<body>
<header class="header"><div class="header-content">
  <div class="logo"><img src="../GKG_Chemie%20LOGO.png" alt="Logo GKG Chemie"></div><br>
  <div class="header-badge" id="badge">KLASSE</div>
  <h1>Chemie Grundlagenfach</h1>
  <p>Wählen Sie ein Thema und eine Phase, um zum Skript zu gelangen.</p>
</div></header>
<main class="main">
  <div class="section-label">Themen</div>
  <div class="topics" id="topics"></div>
  <div class="note">Die Phasen werden im Verlauf des Schuljahres freigeschaltet.<br>Bei Fragen wenden Sie sich an Ihre Lehrperson.</div>
</main>
<script src="../themen.js"></script>
<script>
/* Diese Seite ist für alle Klassen identisch. Gesteuert wird sie über freigabe.json im selben Ordner. */
const ordner = location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '').split('/').pop().toLowerCase();
try { localStorage.setItem('glf-klasse', ordner); } catch (e) {}
function heute() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function datumCH(iso) { const [y, m, d] = iso.split('-'); return +d + '.' + +m + '.' + y; }
fetch('freigabe.json', { cache: 'no-store' }).then(r => r.json()).then(cfg => {
  document.getElementById('badge').textContent = 'KLASSE ' + (cfg.klasse || ordner).toUpperCase();
  document.title = 'Chemie GLF · ' + (cfg.klasse || ordner);
  const themen = cfg.themen || {};
  document.getElementById('topics').innerHTML = THEMEN.filter(t => t.id in themen).map((t, i) => {
    const f = themen[t.id];
    let irgendwasFrei = false;
    const rows = t.phasen.map(p => {
      const w = f[String(p.nr)];
      const istDatum = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
      const offen = v => v === 'frei' || v === true || (istDatum(v) && heute() >= v);
      // Wert pro Phase: "frei" / "gesperrt" / Datum – oder pro Doppellektion { "DL1": …, "DL2": … }
      const teile = (w && typeof w === 'object') ? Object.values(w) : [w];
      const nOffen = teile.filter(offen).length;
      // Bei Freigabe pro Doppellektion: jede DL einzeln anzeigen
      const dlZeile = (w && typeof w === 'object') ? '<div class="dls">' + Object.entries(w).map(([dl, v]) =>
        offen(v) ? `<span class="dl frei">${dl} offen</span>` : istDatum(v) ? `<span class="dl bald">${dl} ab ${datumCH(v)}</span>` : `<span class="dl zu">${dl} &#x1F512;</span>`).join('') + '</div>' : '';
      if (nOffen) {
        irgendwasFrei = true;
        const info = teile.length > 1 ? (nOffen === teile.length ? 'offen' : nOffen + ' von ' + teile.length + ' DL offen') : 'offen';
        return `<a class="ph" href="../${p.datei}?k=${ordner}"><span class="nr">Phase ${p.nr}</span><span class="t">${p.titel}</span><span class="st frei">${info} &rarr;</span></a>${dlZeile}`;
      }
      const daten = teile.filter(istDatum).sort();
      const st = daten.length ? `<span class="st bald">ab ${datumCH(daten[0])}</span>` : `<span class="st zu">&#x1F512; gesperrt</span>`;
      return `<div class="ph zu"><span class="nr">Phase ${p.nr}</span><span class="t">${p.titel}</span>${st}</div>${dlZeile}`;
    }).join('');
    return `<div class="card${irgendwasFrei ? '' : ' locked'}"><div class="num" style="color:${t.farbe}">Thema ${i + 1}</div><div class="title">${t.titel}</div><div class="desc">${t.text}</div><div class="phases">${rows}</div></div>`;
  }).join('');
}).catch(() => {
  document.getElementById('topics').innerHTML = '<div class="err">Die Freigabe-Datei dieser Klasse konnte nicht gelesen werden. Prüfen Sie freigabe.json auf Tippfehler (Kommas, Anführungszeichen).</div>';
});
</script>
</body>
</html>
